<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Belépés — stopjeger.hu belső felület</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<button id="themeToggle" class="theme-toggle floating" type="button" aria-label="Sötét/világos téma váltása" title="Sötét/világos téma váltása">
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.8 14.5A8.5 8.5 0 0 1 9.5 3.2a.5.5 0 0 0-.6-.7 9.5 9.5 0 1 0 12.6 12.6.5.5 0 0 0-.7-.6Z"/></svg>
</button>

<main class="auth">
  <div class="auth-card">
    <span class="eyebrow">STOP JÉGER · belső felület</span>

    <section id="stepLogin">
      <h1>Belépés</h1>
      <form id="formLogin" novalidate>
        <label class="field"><span>E-mail-cím</span>
          <input id="email" type="email" autocomplete="username" required></label>
        <label class="field"><span>Jelszó</span>
          <input id="password" type="password" autocomplete="current-password" required></label>
        <button class="btn" type="submit">Tovább</button>
      </form>
      <p class="aside"><button class="link" type="button" id="toForgot">Elfelejtett jelszó?</button></p>
    </section>

    <section id="stepCode" hidden>
      <h1>Belépési kód</h1>
      <p class="muted" id="codeHint">Küldtünk egy 6 jegyű kódot az e-mail-címedre.</p>
      <form id="formCode" novalidate>
        <label class="field"><span>6 jegyű kód</span>
          <input id="code" class="code-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="7" required></label>
        <button class="btn" type="submit">Belépés</button>
      </form>
      <p class="aside"><button class="link" type="button" id="backToLogin">Nem jött meg a kód? Kérj újat</button></p>
    </section>

    <section id="stepForgot" hidden>
      <h1>Elfelejtett jelszó</h1>
      <p class="muted">Add meg az e-mail-címed, és küldünk egy hivatkozást, amivel új jelszót állíthatsz be.</p>
      <form id="formForgot" novalidate>
        <label class="field"><span>E-mail-cím</span>
          <input id="forgotEmail" type="email" autocomplete="username" required></label>
        <button class="btn" type="submit">Hivatkozás küldése</button>
      </form>
      <p class="aside"><button class="link" type="button" id="forgotBack">Vissza a belépéshez</button></p>
    </section>

    <p id="msg" class="msg" role="status" aria-live="polite" hidden></p>
  </div>
  <p class="auth-foot">A belépéshez jelszó és egy e-mailben kapott kód is kell.</p>
</main>

<script src="/admin/common.js"></script>
<script src="/admin/login.js"></script>
</body>
</html>
